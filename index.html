<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CountDown Timer</title>
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <h1>2027 GENERAL ELECTIONS !</h1>
    <div class="countdown">
      <div class="timer">
        <span class="time" id="days">310</span>
        <span class="label">Days</span>
      </div>

      <div class="timer">
        <span class="time" id="hours">12</span>
        <span class="label">Hours</span>
      </div>

      <div class="timer">
        <span class="time" id="min">30</span>
        <span class="label">Minutes</span>
      </div>

      <div class="timer">
        <span class="time" id="secs">42</span>
        <span class="label">Secs</span>
      </div>

    </div>
    <div class="footer">
        <footer>
         <p>&copy; <span id="year"></span> Otwoma Marvine. All rights reserved.</p>
       </footer>
      </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
